name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  design-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:tokens
      - run: npm run check:design-ratchet
      - run: npm run check:design
      - run: npm run check:crons
